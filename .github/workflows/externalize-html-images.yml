name: Externalize HTML images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  externalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace base64 images using figure captions
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          FIG_RE = re.compile(r'<figure\b[^>]*\bclass=["\'][^"\']*\bfig\b[^"\']*["\'][^>]*>.*?</figure\s*>', re.IGNORECASE | re.DOTALL)
          IMG_RE = re.compile(r'''(?P<prefix><img\b[^>]*?\bsrc=["'])(?P<src>data:image/[^;]+;base64,[^"']*)(?P<suffix>["'])''', re.IGNORECASE)
          CAPTION_RE = re.compile(r'شکل\s*([0-9۰-۹]+)\s*[.٫]\s*([0-9۰-۹]+)', re.IGNORECASE)
          DIGITS = str.maketrans('۰۱۲۳۴۵۶۷۸۹', '0123456789')

          changed_files = 0
          total = 0

          for html in sorted(ROOT.glob('??-فصل*.html')):
              m = re.match(r'^(\d{2})-', html.name)
              if not m:
                  continue
              ch = int(m.group(1))
              if not 1 <= ch <= 26:
                  continue

              figure_dir = ROOT / 'figures' / f'ch{ch:02d}'
              if not figure_dir.is_dir():
                  raise SystemExit(f'{html}: missing {figure_dir}')

              text = html.read_text(encoding='utf-8')
              changed_box = [0]

              def replace_figure(match):
                  block = match.group(0)
                  imgs = list(IMG_RE.finditer(block))
                  if not imgs:
                      return block

                  cap = CAPTION_RE.search(block)
                  if not cap:
                      raise SystemExit(f'{html}: could not determine figure number for embedded image')

                  fig_ch = cap.group(1).translate(DIGITS)
                  fig_no = cap.group(2).translate(DIGITS)
                  if int(fig_ch) != ch:
                      raise SystemExit(f'{html}: caption chapter {fig_ch} does not match HTML chapter {ch}')

                  filename = f'fig-{ch}-{int(fig_no)}.jpg'
                  target = figure_dir / filename
                  if not target.is_file():
                      raise SystemExit(f'{html}: expected image file not found: {target}')

                  out = []
                  pos = 0
                  for img in imgs:
                      out.append(block[pos:img.start()])
                      out.append(img.group('prefix') + f'figures/ch{ch:02d}/{filename}' + img.group('suffix'))
                      pos = img.end()
                      changed_box[0] += 1
                  out.append(block[pos:])
                  return ''.join(out)

              new_text = FIG_RE.sub(replace_figure, text)

              if new_text != text:
                  html.write_text(new_text, encoding='utf-8')
                  changed_files += 1
                  total += changed_box[0]
                  print(f'{html}: externalized {changed_box[0]} images')

          print(f'Changed {changed_files} HTML files; externalized {total} images.')
          PY

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' .github/workflows/externalize-html-images.yml
          git rm -f .github/workflows/externalize-html-images.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: replace base64 HTML images with chapter paths [skip ci]'
          git push
