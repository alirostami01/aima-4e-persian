name: Externalize HTML images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  externalize:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace base64 images with chapter paths
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')
          IMG_RE = re.compile(r'''(?P<prefix><img\b[^>]*?\bsrc=["'])(?:data:image/[^;]+;base64,[^"']*)(?P<suffix>["'])''', re.IGNORECASE)

          def natural_key(path: Path):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r'(\d+)', path.name)]

          total = 0
          changed_files = 0

          for html in sorted(ROOT.glob('??-فصل*.html')):
              m = re.match(r'^(\d{2})-', html.name)
              if not m:
                  continue
              ch = int(m.group(1))
              if not 1 <= ch <= 26:
                  continue

              figure_dir = ROOT / 'figures' / f'ch{ch:02d}'
              images = sorted(
                  [p for p in figure_dir.iterdir() if p.is_file() and p.suffix.lower() in {'.jpg', '.jpeg', '.png', '.webp'}],
                  key=natural_key,
              ) if figure_dir.is_dir() else []

              text = html.read_text(encoding='utf-8')
              matches = list(IMG_RE.finditer(text))
              if not matches:
                  continue

              if len(matches) != len(images):
                  raise SystemExit(f'{html}: found {len(matches)} embedded images but {len(images)} files in {figure_dir}')

              out = []
              pos = 0
              for i, match in enumerate(matches):
                  out.append(text[pos:match.start()])
                  out.append(match.group('prefix') + f'figures/ch{ch:02d}/{images[i].name}' + match.group('suffix'))
                  pos = match.end()
              out.append(text[pos:])
              new_text = ''.join(out)

              if new_text != text:
                  html.write_text(new_text, encoding='utf-8')
                  changed_files += 1
                  total += len(matches)
                  print(f'{html}: {len(matches)} images -> {figure_dir}')

          print(f'Changed {changed_files} HTML files; externalized {total} images.')
          PY

      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.html' .github/workflows/externalize-html-images.yml
          git rm -f .github/workflows/externalize-html-images.yml
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: replace base64 HTML images with chapter paths [skip ci]'
          git push
