name: Reorganize book files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reorganize files and fix links
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          import subprocess

          root = Path('.')
          html_dir = root / 'html'
          md_dir = root / 'markdown'
          html_dir.mkdir(exist_ok=True)
          md_dir.mkdir(exist_ok=True)

          html_files = sorted(root.glob('*.html'))
          md_files = sorted(root.glob('*.md'))
          md_files = [p for p in md_files if p.name != 'README.md']

          html_names = [p.name for p in html_files]
          md_names = [p.name for p in md_files]

          def natural_key(path: Path):
              return [int(x) if x.isdigit() else x.lower() for x in re.split(r'(\d+)', path.name)]

          img_pattern = re.compile(r'(<img\b[^>]*?\bsrc=")data:image/[^";]+;base64,[^"]+(")', re.I | re.S)

          for path in html_files:
              text = path.read_text(encoding='utf-8')
              m = re.match(r'^(\d+)-', path.name)
              if m:
                  chapter = int(m.group(1))
                  if chapter > 0:
                      img_dir = root / 'figures' / f'ch{chapter:02d}'
                      images = sorted(img_dir.glob('*'), key=natural_key) if img_dir.exists() else []
                      matches = list(img_pattern.finditer(text))
                      if len(matches) != len(images):
                          raise SystemExit(f'{path}: found {len(matches)} embedded images but {len(images)} files in {img_dir}')
                      i = 0
                      def replace_image(match):
                          nonlocal i
                          image = images[i]
                          i += 1
                          return f'{match.group(1)}../figures/{img_dir.name}/{image.name}{match.group(2)}'
                      text = img_pattern.sub(replace_image, text)

              # Chapter navigation links must point to the new html directory.
              for name in html_names:
                  text = text.replace(f'href="{name}"', f'href="../html/{name}"')

              path.write_text(text, encoding='utf-8')

          # Move book Markdown and HTML files after updating their contents.
          for path in html_files:
              subprocess.run(['git', 'mv', str(path), str(html_dir / path.name)], check=True)
          for path in md_files:
              subprocess.run(['git', 'mv', str(path), str(md_dir / path.name)], check=True)

          # Keep README navigation valid after the move.
          readme = root / 'README.md'
          if readme.exists():
              text = readme.read_text(encoding='utf-8')
              for name in md_names:
                  text = text.replace(f'({name})', f'(markdown/{name})')
                  text = text.replace(f'`{name}`', f'`markdown/{name}`')
              for name in html_names:
                  text = text.replace(f'({name})', f'(html/{name})')
                  text = text.replace(f'`{name}`', f'`html/{name}`')
              text += '\n## Project structure\n\n- `html/` — HTML versions of the book chapters.\n- `markdown/` — Markdown source files for the book.\n- `figures/` — Book figures, organized by chapter. HTML files reference these images directly instead of embedding base64 data.\n'
              readme.write_text(text, encoding='utf-8')

          # Remove this one-shot workflow so it cannot remain as project clutter.
          workflow = root / '.github' / 'workflows' / 'reorganize-book.yml'
          if workflow.exists():
              workflow.unlink()

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', '-A'], check=True)
          subprocess.run(['git', 'commit', '-m', 'refactor: organize book sources and HTML assets'], check=True)
          subprocess.run(['git', 'push'], check=True)
          PY