name: Reorganize book files

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reorganize:
    if: github.event.head_commit.message != 'chore: reorganize book files'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move HTML and Markdown files and fix links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p html markdown

          # Move all book HTML files from the repository root.
          find . -maxdepth 1 -type f -name '*.html' -print0 | while IFS= read -r -d '' f; do
            git mv "$f" "html/$(basename "$f")"
          done

          # Move the numbered book Markdown files (00- through 28-).
          find . -maxdepth 1 -type f -regextype posix-extended -regex './[0-9]{2}-.*\.md' -print0 | while IFS= read -r -d '' f; do
            git mv "$f" "markdown/$(basename "$f")"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re

          html_dir = Path('html')
          for path in html_dir.glob('*.html'):
              text = path.read_text(encoding='utf-8')
              # Images now resolve from html/ to the existing root figures/ folder.
              text = text.replace('src="figures/', 'src="../figures/')
              text = text.replace("src='figures/", "src='../figures/")
              # Chapter-to-chapter HTML navigation now resolves from html/.
              text = re.sub(r'(href=["\'])([0-9]{2}-[^"\']+\.html)(["\'])', r'\1../html/\2\3', text)
              path.write_text(text, encoding='utf-8')

          # Update README references to the new locations.
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = re.sub(r'(?<![\w/])([0-9]{2}-[^\s\)\`]+\.md)', r'markdown/\1', text)
          text = re.sub(r'(?<![\w/])([0-9]{2}-[^\s\)\`]+\.html)', r'html/\1', text)
          # Prevent accidental double-prefixing if this workflow is ever rerun.
          text = text.replace('markdown/markdown/', 'markdown/')
          text = text.replace('html/html/', 'html/')
          readme.write_text(text, encoding='utf-8')

          git add -A
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: reorganize book files'
          git push

          # Remove this one-shot workflow without creating another run.
          git rm .github/workflows/reorganize-book.yml
          git commit -m 'chore: remove reorganization workflow'
          git push
