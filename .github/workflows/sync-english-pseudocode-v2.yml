name: Sync English AIMA 4e pseudocode v2
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sync pseudocode from official AIMA 4e algorithms PDF
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          git clone --depth 1 https://github.com/aimacode/aima-pseudocode.git /tmp/aima-pseudocode
          pdftotext -layout /tmp/aima-pseudocode/algorithms.pdf /tmp/aima4e-algorithms.txt
          python3 <<'PY'
          import html, pathlib, re
          root=pathlib.Path('.')
          pdf=pathlib.Path('/tmp/aima4e-algorithms.txt').read_text(encoding='utf-8',errors='replace').replace('\f','\n')
          persian=re.compile(r'[\u0600-\u06ff\u0750-\u077f\u08a0-\u08ff]')
          # Extract each official function/procedure from the PDF independently.
          definitions=[]
          def_re=re.compile(r'(?is)\b(function|procedure)\s+([A-Z][A-Z0-9?*_-]*)\b')
          matches=list(def_re.finditer(pdf))
          for i,m in enumerate(matches):
              name=m.group(2).upper(); start=m.start(); end=len(pdf)
              if i+1 < len(matches): end=matches[i+1].start()
              fig=re.search(r'(?is)\bFigure\s+\d+\.\d+\b',pdf[m.end():end])
              if fig: end=m.end()+fig.start()
              body=pdf[start:end].strip()
              body=re.sub(r'(?m)^\s*(?:CHAPTER|Chapter)\s+\d+\s*$','',body)
              body=re.sub(r'(?m)^\s*\d+\s*$','',body)
              body=re.sub(r'\n{3,}','\n\n',body).strip()
              if body and not persian.search(body): definitions.append((name,body))
          sources={}
          for name,body in definitions:
              sources.setdefault(name,body)
          aliases={'MINIMAX-DECISION':'MINIMAX-SEARCH','MAX-VALUE':'MINIMAX-SEARCH','MIN-VALUE':'MINIMAX-SEARCH'}
          block_re=re.compile(r'(?s)(<pre\s+class=["\']code["\']\s*>\s*<code[^>]*>)(.*?)(</code>\s*</pre>)')
          def source_for(raw):
              text=html.unescape(re.sub(r'<[^>]+>','',raw))
              names=[n.upper() for n in re.findall(r'\b(?:function|procedure)\s+([A-Z][A-Z0-9?*_-]*)',text)]
              # Also recognize helper-only blocks and common fragments.
              if 'game.IS-CUTOFF' in text or 'MAX-VALUE' in text: names.append('MINIMAX-SEARCH')
              for n in names:
                  key=aliases.get(n,n)
                  if key in sources: return sources[key]
              return None
          html_files=sorted(root.glob('[0-9][0-9]-*.html')); stats={'total':0,'replaced':0,'unmatched':0}; unmatched=[]; changed=[]
          for path in html_files:
              original=path.read_text(encoding='utf-8')
              def replace(match):
                  stats['total']+=1; source=source_for(match.group(2))
                  if source is None:
                      stats['unmatched']+=1; return match.group(0)
                  stats['replaced']+=1; return match.group(1)+html.escape(source,quote=False)+match.group(3)
              updated=block_re.sub(replace,original)
              if updated!=original: path.write_text(updated,encoding='utf-8'); changed.append(str(path))
          remaining=[]
          for path in html_files:
              text=path.read_text(encoding='utf-8')
              for m in block_re.finditer(text):
                  code=html.unescape(re.sub(r'<[^>]+>','',m.group(2)))
                  if persian.search(code) and re.search(r'\b(?:function|procedure)\b',code): remaining.append((str(path),code.splitlines()[0].strip()))
          print(f"HTML files scanned: {len(html_files)}")
          print(f"Pseudocode blocks found: {stats['total']}")
          print(f"Pseudocode blocks replaced: {stats['replaced']}")
          print(f"Unmatched blocks: {stats['unmatched']}")
          print(f"Files changed: {len(changed)}")
          for x in changed: print('changed:',x)
          if remaining:
              print('ERROR: Persian pseudocode remains:')
              for p,x in sorted(set(remaining)): print('-',p,':',x)
              raise SystemExit(1)
          PY
      - name: Commit synchronized HTML files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: use English AIMA 4e pseudocode in HTML"
          git push
